name: Auto Quality Tags
description: Scans the full library and applies resolution + codec tags from file metadata. Includes a dedicated task to replace outdated quality tags.
version: 0.2.1
url: https://github.com/datamori-io/stash-plugins

exec:
  - auto-quality-tags.js
interface: js

tasks:
  - name: Apply Resolution & Codec Tags
    description: Pages through all scenes and adds missing resolution + codec tags (does not remove existing ones).
    defaultArgs:
      createMissing: "true"
      dryRun: "false"
      replaceOutdated: "false"
      pageSize: "100"

  - name: Replace outdated quality tags
    description: Full library scan. Removes old res/codec tags that no longer match the file, then applies the correct ones. Other tags are left untouched.
    defaultArgs:
      createMissing: "true"
      dryRun: "false"
      replaceOutdated: "true"
      pageSize: "100"
