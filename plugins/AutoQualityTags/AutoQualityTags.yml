name: Auto Quality Tags
description: Scans the full library and applies resolution (4K, 1080p...) and codec (HEVC, H.264, AV1...) tags from file metadata. Can optionally replace outdated quality tags.
version: 0.2.0
url: https://github.com/datamori-io/stash-plugins

exec:
  - auto-quality-tags.js
interface: js

tasks:
  - name: Apply Resolution & Codec Tags
    description: Pages through all scenes and applies resolution + codec tags. Set replaceOutdated to true to remove old quality tags that no longer match the file.
    defaultArgs:
      createMissing: "true"
      dryRun: "false"
      replaceOutdated: "false"
      pageSize: "100"

settings:
  createMissingTags:
    displayName: Create tags if they do not exist
    type: BOOLEAN
