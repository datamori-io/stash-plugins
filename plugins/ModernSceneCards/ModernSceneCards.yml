name: Modern Scene Cards
description: Orange/dark-grey modern cards. Studio top-right; res/codec/time bottom-right; optional Watched badge when play progress is over 25% of duration.
version: 0.5.0
url: https://github.com/datamori-io/stash-plugins

ui:
  css:
    - modern-scene-cards.css
  javascript:
    - modern-scene-cards.js

settings:
  showWatchedBadge:
    displayName: Show Watched badge (play progress over 25%)
    type: BOOLEAN
